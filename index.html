<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="找不到藥">
<meta name="theme-color" content="#EFF6FC">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>找不到藥</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { overscroll-behavior-y: contain; overflow-x: hidden; width: 100%; }
  body {
    margin: 0; font-family: 'Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif;
    background: #EFF6FC; color: #042C53; overscroll-behavior-y: contain;
    overflow-x: hidden; width: 100%;
  }
  .screen { min-height: 100vh; min-height: 100dvh; display: none; flex-direction: column; }
  .screen.active { display: flex; }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }

  #loginScreen { align-items: center; padding: 64px 28px 32px; }
  .logo { margin-bottom: 16px; width: 104px; height: 104px; }
  .title-cn { font-size: 26px; font-weight: 700; letter-spacing: 1px; margin: 0 0 6px; }
  .title-en { font-size: 11px; color: #185FA5; letter-spacing: 3px; margin: 0 0 40px; }
  .login-card { width: 100%; max-width: 320px; background: rgba(255,255,255,0.75); border-radius: 16px; padding: 4px 18px; }
  .login-row { display: flex; align-items: center; height: 52px; gap: 12px; }
  .login-row span { font-size: 14px; color: #85B7EB; font-weight: 500; width: 32px; flex-shrink: 0; }
  .login-row input { flex: 1; height: 100%; border: none; background: transparent; font-size: 16px; outline: none; }
  .btn-primary { width: 100%; max-width: 320px; height: 48px; border-radius: 24px; background: #B5D4F4; color: #0C447C; border: none; font-size: 16px; font-weight: 700; margin-top: 22px; }

  .topbar { display: flex; align-items: center; gap: 10px; padding: 18px 16px 12px; }
  .icon-btn { width: 52px; height: 52px; border-radius: 14px; background: #fff; border: 0.5px solid #B5D4F4; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0; }
  .search-wrap { flex: 1; display: flex; align-items: center; background: #fff; border-radius: 16px; border: 0.5px solid #B5D4F4; height: 52px; padding: 0 16px; gap: 10px; }
  .search-wrap svg { flex-shrink: 0; }
  #search { flex: 1; height: 100%; border: none; background: transparent; font-size: 16px; outline: none; padding: 0; }

  .status-bar { display: flex; align-items: center; justify-content: space-between; padding: 0 16px 10px; font-size: 11px; color: #7699B8; }

  #list { background: #fff; border-radius: 18px 18px 0 0; padding: 4px 8px; flex: 1; min-height: 55vh; }
  .item-row { padding: 13px 8px; border-bottom: 0.5px solid #eee; }
  .item-row .name-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 3px; }
  .item-row .name { margin: 0; font-size: 18px; font-weight: 700; color: #2E4E6B; line-height: 1.35; overflow-wrap: anywhere; min-width: 0; }
  .item-row .full { margin: 0 0 9px; font-size: 13px; color: #7699B8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 8px; flex-shrink: 0; }
  .tag-code { background: #B5D4F4; color: #0C447C; font-weight: 700; }
  .tag-loc { background: #F1F8FE; color: #185FA5; border: 0.5px solid #B5D4F4; }
  .tag-place-set { background: #FBF3D9; color: #7A5B06; }
  .tag-place-unset { background: #FCEBEB; color: #791F1F; }
  .empty-msg { text-align: center; color: #999; font-size: 13px; padding: 40px 20px; line-height: 1.6; }

  .item-row.muted .name { color: #7699B8; }
  .item-row.muted .tag-code { background: #F1EFE8; color: #888780; }
  .item-row.muted .tag-loc { background: #F1EFE8; color: #888780; border-color: #ddd; }
  .tag-status { background: transparent; color: #888780; border: 0.5px solid #ccc; }

  #emptyState { display: flex; flex-direction: column; padding: 20px 24px 0; }
  .chip-grid { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .chip { height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #fff; border: 0.5px solid #B5D4F4; font-size: 14px; font-weight: 700; color: #0C447C; padding: 0; }
  .recent-wrap { width: 100%; margin-top: 26px; }
  .recent-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .recent-head span { font-size: 12px; color: #7699B8; }
  .recent-head button { background: none; border: none; padding: 4px; display: flex; }
  .recent-item { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; border: 0.5px solid #eee; }
  .recent-item .tag-code { font-size: 11px; padding: 1px 7px; }
  .recent-item span.rname { font-size: 13px; color: #2E4E6B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent-empty { font-size: 12px; color: #bbb; text-align: center; padding: 8px 0; }

  #overlay { position: fixed; inset: 0; background: rgba(4,44,83,0.35); z-index: 8; opacity: 0; pointer-events: none; transition: opacity 0.28s ease-out; }
  #overlay.open { pointer-events: auto; }
  #overlay.dragging { transition: none; }
  #drawer { position: fixed; top: 0; left: 0; bottom: 0; width: 250px; background: #fff; z-index: 9; box-shadow: 2px 0 16px rgba(0,0,0,0.15); padding: 20px 0; overflow-y: auto; transform: translateX(-100%); transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
  #drawer.open { transform: translateX(0); }
  #drawer.dragging { transition: none; }
  .cat-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: transparent; border: none; text-align: left; }
  .cat-row.active { background: #E6F1FB; }
  .cat-row .label { flex: 1; font-size: 14px; color: #2E4E6B; }
  .cat-row .n { font-size: 12px; color: #999; }

  #edgeHandle { position: fixed; left: 0; top: 50%; transform: translateY(-50%); width: 5px; height: 56px; background: #B5D4F4; border-radius: 0 6px 6px 0; opacity: 0.55; z-index: 5; }
  #swipeHint { position: fixed; left: 12px; top: 50%; transform: translateY(-50%) translateX(-8px); background: rgba(12,68,124,0.92); color: #fff; font-size: 12px; padding: 8px 12px; border-radius: 8px; white-space: nowrap; z-index: 6; opacity: 0; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease; }
  #swipeHint.show { opacity: 1; transform: translateY(-50%) translateX(0); }

  #detailScreen { background: #fff; }
  #saveToast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%) translateY(-40px); background: #185FA5; color: #fff; font-size: 13px; padding: 8px 18px; border-radius: 20px; opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease; white-space: nowrap; z-index: 25; }
  #saveToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .detail-top { display: flex; align-items: center; gap: 10px; padding: 16px; border-bottom: 0.5px solid #eee; }
  .detail-body { padding: 20px 18px; flex: 1; }
  .field { margin-bottom: 22px; }
  .field label { display: block; font-size: 13px; color: #999; margin-bottom: 7px; }
  .field .value { font-size: 19px; font-weight: 700; color: #2E4E6B; line-height: 1.5; }
  .field .value.sub { font-size: 16px; font-weight: 400; color: #7699B8; }
  .field input { width: 100%; font-size: 18px; padding: 12px 14px; border-radius: 10px; border: 0.5px solid #ccc; outline: none; font-family: inherit; }
  .tag-row-detail { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .btn-save { width: 100%; height: 48px; border-radius: 24px; background: #B5D4F4; color: #0C447C; border: none; font-size: 16px; font-weight: 700; margin-top: 10px; }
  .divider { height: 0.5px; background: #eee; margin: 22px 0; }

  #pullIndicator {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 0;
    overflow: hidden;
    color: #185FA5;
    font-size: 13px;
    transition: height 0.15s ease;
  }
  #pullIndicator .spinner {
    width: 16px; height: 16px;
    border: 2px solid #B5D4F4;
    border-top-color: #0C447C;
    border-radius: 50%;
    margin-right: 8px;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  #pullIndicator.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status-bar.tappable { cursor: pointer; }

  #errModal { display: none; position: fixed; inset: 0; background: rgba(4,44,83,0.35); z-index: 20; align-items: center; justify-content: center; padding: 24px; }
  .modal-box { background: #fff; border-radius: 16px; padding: 24px 20px; width: 100%; max-width: 300px; text-align: center; }
  .modal-box p { margin: 0 0 18px; font-size: 15px; color: #333; line-height: 1.5; }
  .modal-box button { width: 100%; height: 42px; border-radius: 21px; background: #B5D4F4; color: #0C447C; border: none; font-size: 15px; font-weight: 700; }

  #versionModal { display: none; position: fixed; inset: 0; background: rgba(4,44,83,0.35); z-index: 20; align-items: center; justify-content: center; padding: 24px; }
  .version-box { background: #fff; border-radius: 16px; padding: 22px 20px; width: 100%; max-width: 300px; text-align: left; }
  .version-box .v-title { font-size: 16px; font-weight: 700; color: #042C53; margin: 0 0 16px; }
  #versionList { display: flex; flex-direction: column; gap: 6px; max-height: 50vh; overflow-y: auto; }
  .v-item { border: 0.5px solid #eee; border-radius: 10px; overflow: hidden; }
  .v-head { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; background: #fff; border: none; text-align: left; }
  .v-head .v-num { font-size: 14px; font-weight: 700; color: #042C53; }
  .v-head svg { transition: transform 0.25s; flex-shrink: 0; }
  .v-item.open .v-head svg { transform: rotate(180deg); }
  .v-body { display: none; padding: 2px 14px 12px; flex-direction: column; gap: 7px; }
  .v-item.open .v-body { display: flex; }
  .v-line { display: flex; font-size: 12.5px; color: #555; line-height: 1.5; }
  .v-line .dot { flex-shrink: 0; }
  .v-line .txt { flex: 1; }
  .version-box .v-close { margin-top: 14px; width: 100%; height: 42px; border-radius: 21px; background: #B5D4F4; color: #0C447C; border: none; font-size: 15px; font-weight: 700; }
</style>
</head>
<body>

<div id="loginScreen" class="screen active">
  <svg class="logo" width="104" height="104" viewBox="0 0 68 68">
    <rect x="4" y="4" width="60" height="60" rx="16" fill="#FBFDFF"/>
    <g transform="translate(30,30) rotate(-35)">
      <rect x="-19" y="-6.5" width="38" height="13" rx="6.5" fill="#85B7EB"/>
      <rect x="-19" y="-6.5" width="19" height="13" rx="6.5" fill="#0C447C"/>
      <rect x="-9" y="-6.5" width="9" height="13" fill="#0C447C"/>
      <path d="M 0 -6.5 L 0 6.5" stroke="#FBFDFF" stroke-width="1.5"/>
    </g>
    <g transform="translate(46,46)">
      <circle r="10" fill="#FBFDFF" stroke="#0C447C" stroke-width="2.2"/>
      <line x1="7" y1="7" x2="13" y2="13" stroke="#0C447C" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </svg>
  <p class="title-cn">找不到藥</p>
  <p class="title-en">FIND MEDICINE</p>
  <div class="login-card">
    <div class="login-row">
      <span>ID</span>
      <input id="empId" type="text" placeholder="部門代號" autocomplete="off">
    </div>
  </div>
  <button class="btn-primary" id="loginBtn">登入</button>
</div>

<div id="errModal">
  <div class="modal-box">
    <p id="errModalMsg"></p>
    <button id="errModalOk">好</button>
  </div>
</div>

<div id="versionModal">
  <div class="version-box">
    <p class="v-title">版本資訊</p>
    <div id="versionList"></div>
    <button class="v-close" id="versionModalClose">好</button>
  </div>
</div>

<div id="homeScreen" class="screen">
  <div id="homeInner" style="flex:1; display:flex; flex-direction:column; justify-content:center;">
    <div class="topbar">
      <button class="icon-btn" id="homeBtn" aria-label="回首頁">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
      </button>
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="text" placeholder="搜尋藥名、藥品碼、料位號">
      </div>
    </div>

    <div id="emptyState">
      <div class="chip-grid" id="chipGrid"></div>
      <div class="recent-wrap">
        <div class="recent-head">
          <span>最近查詢</span>
          <button id="clearRecentBtn" aria-label="清除最近查詢">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
        <div id="recentList"></div>
      </div>
    </div>

    <div id="resultsState" style="display:none; flex:1; flex-direction:column;">
      <div class="status-bar tappable" id="statusBar">
        <span id="statusText">載入中…</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </div>
      <div id="pullIndicator"><span class="spinner"></span><span id="pullText">下拉重新整理</span></div>
      <div id="list"></div>
    </div>
  </div>

  <div id="edgeHandle" aria-hidden="true"></div>
  <div id="swipeHint">向右滑動開啟選單</div>
</div>

<div id="detailScreen" class="screen">
  <div class="detail-top">
    <button class="icon-btn" id="backBtn" aria-label="返回">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0C447C" stroke-width="2.2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
  </div>
  <div id="saveToast">已儲存</div>
  <div class="detail-body" id="detailBody"></div>
</div>

<div id="overlay"></div>
<div id="drawer">
  <div id="cats"></div>
  <div class="divider" style="margin:8px 18px;"></div>
  <button class="cat-row" id="drawerRefreshBtn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    <span class="label" id="drawerRefreshLabel">更新</span>
  </button>
  <button class="cat-row" id="versionInfoBtn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span class="label">版本資訊</span>
  </button>
</div>

<script>
// ==================== 全域設定與狀態 ====================
const API_URL = 'https://script.google.com/macros/s/AKfycbzr7DIlHyO81RHvCX5WKbbs0Rj3q4BziyNQBOvqYnlFg8aGXfIvrAgPbgB_rNC30lqhIw/exec';
const VALID_IDS = ['2690'];

let rawData = [];
let activeFilter = null;
let activeCode = null;
let editing = false;
let saving = false;

// ==================== 放置區 / 狀態 判斷工具 ====================
const DISCONTINUED_STATUSES = ['已剔除', '暫停使用'];
const STATUS_SHORT = { '已剔除': '剔除', '暫停使用': '暫停' };
function isDiscontinued(item) {
  return DISCONTINUED_STATUSES.includes(item['狀態']);
}
function shortStatus(item) {
  return STATUS_SHORT[item['狀態']] || item['狀態'] || '';
}

// ==================== 首頁畫面切換(空白首頁 ↔ 搜尋結果) ====================
function updateHomeView() {
  const hasQuery = !!(document.getElementById('search').value || '').trim();
  const showResults = hasQuery || activeFilter !== null;
  document.getElementById('emptyState').style.display = showResults ? 'none' : 'flex';
  document.getElementById('resultsState').style.display = showResults ? 'flex' : 'none';
  document.getElementById('homeInner').style.justifyContent = showResults ? 'flex-start' : 'center';
  if (!showResults) renderRecent();
}

function setFilter(name) {
  activeFilter = name;
  document.getElementById('search').value = '';
  renderCats();
  renderList();
  updateHomeView();
  closeDrawer();
}

// ==================== 最近查詢紀錄 ====================
const RECENT_KEY = 'recent_codes';
function getRecent() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch(e) { return []; }
}
function addRecent(code) {
  try {
    let list = getRecent().filter(function(c){ return c !== code; });
    list.unshift(code);
    list = list.slice(0, 5);
    localStorage.setItem(RECENT_KEY, JSON.stringify(list));
  } catch(e) {}
}
function renderRecent() {
  const box = document.getElementById('recentList');
  const codes = getRecent();
  box.innerHTML = '';
  if (codes.length === 0) {
    box.innerHTML = '<p class="recent-empty">還沒有查詢紀錄</p>';
    return;
  }
  codes.forEach(function(code) {
    const item = findItem(code);
    if (!item) return;
    const row = document.createElement('div');
    row.className = 'recent-item';
    row.innerHTML = '<span class="tag tag-code">' + code + '</span><span class="rname">' + (item['俗名'] || '（未命名）') + '</span>';
    row.addEventListener('click', function(){ openDetail(code); });
    box.appendChild(row);
  });
}
document.getElementById('clearRecentBtn').addEventListener('click', function(){
  if (!confirm('清除全部最近查詢紀錄？')) return;
  try { localStorage.removeItem(RECENT_KEY); } catch(e) {}
  renderRecent();
});

// ==================== 首頁快速篩選磁磚(調劑檯/專調檯/兒科檯) ====================
function startsWithAny(str, prefixes) {
  const s = String(str || '').toUpperCase();
  return prefixes.some(function(p){ return s.startsWith(p); });
}
const CHIPS = [
  { name: '調劑檯', label: '調劑檯' },
  { name: '專調檯', label: '專調檯' },
  { name: '兒科檯', label: '兒科檯' }
];
function renderChips() {
  const box = document.getElementById('chipGrid');
  box.innerHTML = '';
  CHIPS.forEach(function(c) {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.innerHTML = '<span>' + c.label + '</span>';
    btn.addEventListener('click', function(){ setFilter(c.name); });
    box.appendChild(btn);
  });
}
renderChips();

// ==================== 畫面切換 / 錯誤提示 / 登入 ====================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showErrModal(msg) {
  document.getElementById('errModalMsg').textContent = msg;
  document.getElementById('errModal').style.display = 'flex';
}
document.getElementById('errModalOk').addEventListener('click', () => {
  document.getElementById('errModal').style.display = 'none';
});

document.getElementById('loginBtn').addEventListener('click', () => {
  const id = document.getElementById('empId').value.trim();
  if (!id) { showErrModal('請先輸入部門代號'); return; }
  if (!VALID_IDS.includes(id)) { showErrModal('代號錯誤，無法登入'); return; }
  try { localStorage.setItem('emp_id', id); } catch(e) {}
  showScreen('homeScreen');
  fetchData();
  showSwipeHintOnce();
});
(function autoLogin() {
  try {
    const saved = localStorage.getItem('emp_id');
    if (saved) document.getElementById('empId').value = saved;
  } catch(e) {}
})();

// ==================== 資料格式處理工具(物品碼比對、放置區預設值) ====================
function normalizeCode(code) {
  return String(code || '').replace(/^\*/, '').trim().toLowerCase();
}
function validLoc2(val) {
  const s = String(val || '').trim();
  if (!s) return '';
  return /^[A-Za-z]/.test(s) ? s : '';
}
function displayPlace(item) {
  const manual = item['放置區'] || '';
  if (manual) return manual;
  return validLoc2(item['次料位號']);
}

// ==================== 從 Google 試算表讀取資料 ====================
async function fetchData() {
  const statusEl = document.getElementById('statusText');
  statusEl.textContent = '更新中…';
  try {
    const res = await fetch(API_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('連線失敗');
    const data = await res.json();
    rawData = data;
    try { localStorage.setItem('med_data_cache', JSON.stringify(data)); localStorage.setItem('med_data_time', String(Date.now())); } catch(e) {}
    const now = new Date();
    statusEl.textContent = '已更新 ' + now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
  } catch(err) {
    try {
      const cached = localStorage.getItem('med_data_cache');
      if (cached) {
        rawData = JSON.parse(cached);
        const t = localStorage.getItem('med_data_time');
        statusEl.textContent = t ? ('離線資料（上次更新 ' + new Date(+t).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}) + '）') : '離線資料';
      } else {
        statusEl.textContent = '無法連線，且無離線資料';
      }
    } catch(e) { statusEl.textContent = '無法連線'; }
  }
  renderCats();
  renderList();
  updateHomeView();
}

// ==================== 篩選條件定義、清單排序與渲染 ====================
const FILTERS = [
  { name: '放置區未設定', test: function(d){ return !displayPlace(d); } },
  { name: '調劑檯', test: function(d){ return startsWithAny(d['料位號'], ['GZ', 'GX', 'GY']); } },
  { name: '專調檯', test: function(d){ return startsWithAny(d['料位號'], ['LX', 'LZ', 'LYA', 'LYB']); } },
  { name: '兒科檯', test: function(d){ return startsWithAny(d['料位號'], ['PX', 'PZ']); } }
];
const MENU_GROUPS = [
  ['調劑檯', '專調檯', '兒科檯'],
  ['放置區未設定']
];

function currentList() {
  let items = rawData;
  const filter = FILTERS.find(function(f){ return f.name === activeFilter; });
  if (filter) items = items.filter(filter.test);
  const q = (document.getElementById('search').value || '').trim().toLowerCase();
  if (q) {
    const qNorm = q.replace(/^\*/, '');
    items = items.filter(function(d) {
      const codeNorm = normalizeCode(d['物品碼']);
      return (d['俗名']||'').toLowerCase().includes(q) ||
             (d['品名與內含量']||'').toLowerCase().includes(q) ||
             (d['學名']||'').toLowerCase().includes(q) ||
             (String(d['料位號']||'')).toLowerCase().includes(q) ||
             (String(d['次料位號']||'')).toLowerCase().includes(q) ||
             codeNorm.includes(qNorm);
    });
  } else {
    items = items.filter(function(d){ return !isDiscontinued(d); });
  }
  items = items.slice().sort(function(a, b){
    return String(a['料位號'] || '').localeCompare(String(b['料位號'] || ''), undefined, { numeric: true, sensitivity: 'base' });
  });
  return items;
}

function escRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function highlightText(text, q) {
  const s = String(text || '');
  if (!q) return s;
  const re = new RegExp('(' + escRegex(q) + ')', 'ig');
  return s.replace(re, '<mark style="background:#FBE9A0;color:inherit;padding:0 1px;border-radius:2px;">$1</mark>');
}

function renderList() {
  const items = currentList();
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (items.length === 0) {
    list.innerHTML = '<p class="empty-msg">找不到符合的藥品</p>';
    return;
  }
  const q = (document.getElementById('search').value || '').trim();
  items.forEach(function(d) {
    const code = d['物品碼'];
    const place = displayPlace(d);
    const discontinued = isDiscontinued(d);
    const row = document.createElement('div');
    row.className = 'item-row' + (discontinued ? ' muted' : '');
    row.innerHTML =
      '<div class="name-row">' +
        '<span class="tag tag-code">' + code + '</span>' +
        '<p class="name">' + highlightText(d['俗名'] || '（未命名）', q) + '</p>' +
      '</div>' +
      '<p class="full">' + highlightText(d['品名與內含量'] || '', q) + '</p>' +
      '<div class="tags">' +
        '<span class="tag tag-loc">' + (d['料位號'] || '未設定') + '</span>' +
        '<span class="tag ' + (place ? 'tag-place-set' : 'tag-place-unset') + '">放置區:' + (place || '尚未設定') + '</span>' +
        (discontinued ? '<span class="tag tag-status">' + shortStatus(d) + '</span>' : '') +
      '</div>';
    row.addEventListener('click', function(){ openDetail(code); });
    list.appendChild(row);
  });
}

  if (item['抗生']) tags.push('抗生素');
  if (item['危害'] === 'Y' || item['危害'] === 'S') tags.push('危');

}

function renderDetail() {
  const item = findItem(activeCode);

  const tagsHtml = tags.map(function(t){ return '<span class="tag" style="background:#F1EFE8;color:#5F5E5A;">' + t + '</span>'; }).join(' ');

  function esc(v) { return String(v || '').replace(/"/g, '&quot;'); }
  function field(label, key, value, sub) {
    if (editing) {
      return '<div class="field"><label>' + label + '</label><input id="f_' + key + '" value="' + esc(value) + '"></div>';
    }
    return '<div class="field"><label>' + label + '</label><div class="value' + (sub ? ' sub' : '') + '">' + (value || '（未填寫）') + '</div></div>';
  }

  body.innerHTML =
    field('俗名', 'alias', item['俗名']) +
    field('品名與內含量', 'full', item['品名與內含量'], true) +
    field('學名', 'generic', item['學名'], true) +
    '<div class="divider"></div>' +
    '<div class="field"><label>物品碼</label><div class="value">' + item['物品碼'] + '</div></div>' +
    field('料位號', 'loc', item['料位號']) +
    (editing || loc2 ? field('次料位號', 'loc2', item['次料位號']) : '') +
    (tags.length ? '<div class="field"><label>狀態標籤</label><div class="tag-row-detail">' + tagsHtml + '</div></div>' : '') +
    (editing || item['備註'] ? field('備註', 'note', item['備註'], true) : '') +

// ==================== 寫入資料回 Google 試算表(JSONP,避開 CORS) ====================
function jsonp(url) {
  return new Promise(function(resolve, reject) {
    const cbName = 'jsonpCb' + Date.now();
    const timeoutId = setTimeout(function() {
      cleanup();
      reject(new Error('逾時'));
    }, 10000);
    function cleanup() {
      clearTimeout(timeoutId);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function(data) {
      cleanup();
      resolve(data);
    };
    const script = document.createElement('script');
    script.src = url + '&callback=' + cbName;
    script.onerror = function() {
      cleanup();
      reject(new Error('載入失敗'));
    };
    document.body.appendChild(script);
  });
}

async function saveDetail(fields) {
  saving = true;
  renderDetail();
  try {
    const url = API_URL + '?action=save&code=' + encodeURIComponent(activeCode) + '&fields=' + encodeURIComponent(JSON.stringify(fields));
    const result = await jsonp(url);
    if (!result.success) throw new Error(result.error || '儲存失敗');
    const item = findItem(activeCode);
    if (item) {
      Object.keys(fields).forEach(function(k){ item[k] = fields[k]; });
    }
    saving = false;
    editing = false;
    renderDetail();
    renderCats();
    renderList();
    const toast = document.getElementById('saveToast');
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 1400);
  } catch (err) {
    saving = false;
    renderDetail();
    const errEl = document.getElementById('saveErr');
    if (errEl) errEl.textContent = '儲存失敗，請確認網路連線後再試一次';
  }
}

// ==================== 手勢與導覽：左緣滑動(首頁開選單／詳細頁返回) ====================
(function() {
  let startX = 0, startY = 0, tracking = false, mode = null;
  const EDGE_ZONE = 24;
  const BACK_THRESHOLD = 80;
  const DRAWER_WIDTH = 250;
  const OPEN_THRESHOLD = 100;
  const drawer = document.getElementById('drawer');
  const overlay = document.getElementById('overlay');

  document.addEventListener('touchstart', function(e) {
    const homeActive = document.getElementById('homeScreen').classList.contains('active');
    const detailActive = document.getElementById('detailScreen').classList.contains('active');
    if (!homeActive && !detailActive) return;
    const t = e.touches[0];
    if (t.clientX > EDGE_ZONE) return;
    if (homeActive && drawer.classList.contains('open')) return;
    startX = t.clientX;
    startY = t.clientY;
    tracking = true;
    mode = homeActive ? 'drawer' : 'back';
    if (mode === 'drawer') {
      drawer.classList.add('dragging');
      overlay.classList.add('dragging', 'open');
    }
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (!tracking) return;
    const t = e.touches[0];
    const dx = t.clientX - startX;
    const dy = Math.abs(t.clientY - startY);

    if (mode === 'back') {
      if (dx > BACK_THRESHOLD && dy < 60) {
        tracking = false;
        document.getElementById('backBtn').click();
      }
      return;
    }

    if (dy > 60 && dy > dx) { tracking = false; drawer.classList.remove('dragging'); overlay.classList.remove('dragging', 'open'); return; }
    if (dx <= 0) return;
    if (e.cancelable) e.preventDefault();
    const clamped = Math.min(dx, DRAWER_WIDTH);
    drawer.style.transform = 'translateX(' + (clamped - DRAWER_WIDTH) + 'px)';
    overlay.style.opacity = String(Math.min(clamped / DRAWER_WIDTH, 1));
  }, { passive: false });

  document.addEventListener('touchend', function(e) {
    if (!tracking) return;
    tracking = false;
    if (mode !== 'drawer') return;
    drawer.classList.remove('dragging');
    overlay.classList.remove('dragging');
    drawer.style.transform = '';
    overlay.style.opacity = '';
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    if (dx > OPEN_THRESHOLD) openDrawer(); else closeDrawer();
  }, { passive: true });
})();

// ==================== 手勢與導覽：下拉刷新 ====================
(function() {
  const indicator = document.getElementById('pullIndicator');
  const pullText = document.getElementById('pullText');
  let startY = 0, pulling = false, triggered = false;
  const THRESHOLD = 60;
  const MAX_PULL = 90;

  document.addEventListener('touchstart', function(e) {
    if (!document.getElementById('homeScreen').classList.contains('active')) return;
    if (window.scrollY > 0) return;
    startY = e.touches[0].clientY;
    pulling = true;
    triggered = false;
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (!pulling || triggered) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) { indicator.style.height = '0px'; return; }
    if (e.cancelable) e.preventDefault();
    const capped = Math.min(dy * 0.5, MAX_PULL);
    indicator.style.height = capped + 'px';
    pullText.textContent = capped >= THRESHOLD ? '放開立即更新' : '下拉重新整理';
  }, { passive: false });

  document.addEventListener('touchend', function() {
    if (!pulling) return;
    pulling = false;
    const h = parseFloat(indicator.style.height) || 0;
    if (h >= THRESHOLD && !triggered) {
      triggered = true;
      indicator.classList.add('loading');
      pullText.textContent = '更新中…';
      indicator.style.height = '48px';
      fetchData().then(function() {
        indicator.classList.remove('loading');
        indicator.style.height = '0px';
      });
    } else {
      indicator.style.height = '0px';
    }
  }, { passive: true });
})();

<style>

  #swipeHint { position: fixed; left: 12px; top: 50%; transform: translateY(-50%) translateX(-8px); background: rgba(12,68,124,0.92); color: #fff; font-size: 12px; padding: 8px 12px; border-radius: 8px; white-space: nowrap; z-index: 6; opacity: 0; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease; }

  #scanScreen { background: #EFF6FC; }
  .scan-top { display: flex; align-items: center; gap: 12px; padding: 16px; }
  .scan-title { font-size: 20px; font-weight: 700; color: #0C447C; }
  .scan-body { padding: 0 16px 24px; flex: 1; display: flex; flex-direction: column; gap: 14px; }
  #scanStartBtn { width: 100%; height: 56px; border-radius: 28px; border: none; background: #B5D4F4; color: #0C447C; font-size: 18px; font-weight: 700; }
  #scanStartBtn.on { background: #E3F3E8; color: #1F6B3E; }
  #scanInput { width: 100%; height: 48px; border-radius: 12px; border: 0.5px solid #B5D4F4; background: #fff; font-size: 16px; padding: 0 14px; outline: none; }
  #scanInput:focus { border-color: #185FA5; }
  .scan-tools { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #7699B8; margin-top: -6px; }
  #scanHint { text-align: center; font-size: 13px; color: #7699B8; margin-top: -6px; }
  .scan-btns { display: flex; gap: 6px; flex-shrink: 0; }
  .scan-btns button { white-space: nowrap; }
  #scanRateBtn { background: none; border: 0.5px solid #B5D4F4; color: #185FA5; border-radius: 14px; font-size: 12px; padding: 5px 12px; }
  #scanCamBtn { background: none; border: 0.5px solid #B5D4F4; color: #185FA5; border-radius: 14px; font-size: 12px; padding: 5px 12px; }
  #scanCamBtn.on { background: #185FA5; color: #fff; }
  #camBox { position: relative; background: #000; border-radius: 14px; overflow: hidden; height: 30vh; min-height: 150px; display: none; }
  #camBox video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #camFlash { position: absolute; inset: 0; background: rgba(40,200,90,.5); opacity: 0; transition: opacity .25s; pointer-events: none; }
  #camZoom { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.55); color: #fff; border: 0; border-radius: 12px; font-size: 13px; padding: 5px 12px; display: none; }
  #camMsg { font-size: 12.5px; color: #B3261E; text-align: center; }
  #scanManualBtn { background: none; border: 0.5px solid #B5D4F4; color: #185FA5; border-radius: 14px; font-size: 12px; padding: 5px 12px; }
  .scan-tools2 { display: flex; gap: 8px; align-items: center; margin-top: -4px; }
  #scanVoiceSel { flex: 1; min-width: 0; height: 36px; border-radius: 10px; border: 0.5px solid #B5D4F4; background: #fff; color: #2E4E6B; font-size: 13px; padding: 0 8px; }
  #scanRateBtn, #scanLetterBtn { flex: 1; height: 36px; background: #fff; border: 0.5px solid #B5D4F4; color: #185FA5; border-radius: 10px; font-size: 13px; padding: 0 10px; }
  #scanTwiceBtn { flex-shrink: 0; height: 36px; background: #fff; border: 0.5px solid #B5D4F4; color: #185FA5; border-radius: 10px; font-size: 13px; padding: 0 12px; }
  #scanResult { background: #fff; border-radius: 16px; border: 0.5px solid #B5D4F4; padding: 18px; display: none; flex-direction: column; justify-content: center; gap: 8px; text-align: center; }
  #scanResult .loc { font-size: 38px; font-weight: 800; color: #0C447C; letter-spacing: 1px; overflow-wrap: anywhere; }
  #scanResult .nm { font-size: 22px; font-weight: 700; color: #2E4E6B; overflow-wrap: anywhere; }
  #scanResult .hint { font-size: 14px; color: #7699B8; }
  #scanResult .warn { font-size: 16px; font-weight: 700; color: #B3261E; }
  #scanResult.bad .loc, #scanResult.bad .nm { color: #B3261E; }
  #scanResult .st { font-size: 13px; color: #888780; }
  .scan-hist-title { display: none; font-size: 12px; color: #7699B8; margin-top: 4px; }
  .scan-hist-item { display: flex; gap: 8px; align-items: baseline; background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; border: 0.5px solid #eee; font-size: 14px; color: #2E4E6B; }
  .scan-hist-item .t { color: #7699B8; font-size: 12px; flex-shrink: 0; }
  .scan-hist-item .l { font-weight: 700; color: #0C447C; flex-shrink: 0; }
  .scan-hist-item.bad .l { color: #B3261E; }
  #detailScreen { background: #fff; }
  #detailScreen.overlay-drag { position: fixed; inset: 0; z-index: 15; transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
  #detailScreen.overlay-drag.dragging-live { transition: none; }
  #saveToast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%) translateY(-40px); background: #185FA5; color: #fff; font-size: 13px; padding: 8px 18px; border-radius: 20px; opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease; white-space: nowrap; z-index: 25; }
  #saveToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .detail-top { display: flex; align-items: center; gap: 10px; padding: 16px; border-bottom: 0.5px solid #eee; }
  .detail-body { padding: 20px 18px; flex: 1; }
  .field { margin-bottom: 22px; }
  .field label { display: block; font-size: 13px; color: #999; margin-bottom: 7px; }
  .field .value { font-size: 19px; font-weight: 700; color: #2E4E6B; line-height: 1.5; }
  .field .value.sub { font-size: 16px; font-weight: 400; color: #7699B8; }
  .field input { width: 100%; font-size: 18px; padding: 12px 14px; border-radius: 10px; border: 0.5px solid #ccc; outline: none; font-family: inherit; }
  .tag-row-detail { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .btn-save { width: 100%; height: 48px; border-radius: 24px; background: #B5D4F4; color: #0C447C; border: none; font-size: 16px; font-weight: 700; margin-top: 10px; }
  .divider { height: 0.5px; background: #eee; margin: 22px 0; }

  #pullIndicator {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 0;
    overflow: hidden;
    color: #185FA5;
    font-size: 13px;
    transition: height 0.15s ease;
  }
  #pullIndicator .spinner {
    width: 16px; height: 16px;
    border: 2px solid #B5D4F4;
    border-top-color: #0C447C;
    border-radius: 50%;
    margin-right: 8px;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  #pullIndicator.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status-bar.tappable { cursor: pointer; }
  .status-bar { transition: opacity 0.6s ease; }
  .status-bar.faded { opacity: 0; pointer-events: none; }

  #errModal { display: none; position: fixed; inset: 0; background: rgba(4,44,83,0.35); z-index: 20; align-items: center; justify-content: center; padding: 24px; }
  .modal-box { background: #fff; border-radius: 16px; padding: 24px 20px; width: 100%; max-width: 300px; text-align: center; }
  .modal-box p { margin: 0 0 18px; font-size: 15px; color: #333; line-height: 1.5; }
  .modal-box button { width: 100%; height: 42px; border-radius: 21px; background: #B5D4F4; color: #0C447C; border: none; font-size: 15px; font-weight: 700; }

  #versionModal { display: none; position: fixed; inset: 0; background: rgba(4,44,83,0.35); z-index: 20; align-items: center; justify-content: center; padding: 24px; }

<body>

<div id="errModal">

  </div>
</div>

    <div id="versionList"></div>
    <button class="v-close" id="versionModalClose">關閉</button>
  </div>
</div>

<div id="aboutModal">
  <div class="about-box">
    <p class="a-title">關於</p>

    <div class="sync-badge" id="syncBadge"></div>

    <h4>來源</h4>
    <p>HIS 出入庫系統匯出,由人工同步。無法即時反映 HIS 最新異動,更新時間視匯入頻率而定,可能與正式系統有落差。</p>

    <h4>使用限制</h4>
    <p>僅供內部查找參考,仍應以現場核對及 HIS 正式系統為準。</p>

    <a class="contact-link" href="https://line.me/ti/p/~cch200184" target="_blank" rel="noopener">
      <span class="icon-badge"><img src="line-icon.png" alt="LINE"></span>
      <span class="contact-text">有問題請聯絡</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>

    <button class="a-close" id="aboutModalClose">關閉</button>
  </div>
</div>

  <div id="homeInner" style="flex:1; display:flex; flex-direction:column; justify-content:center;">

      <button class="icon-btn" id="homeBtn" aria-label="回首頁">

      </button>
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

        </button>
      </div>
    </div>

        <div class="recent-head">
          <span>最近查詢</span>

            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>

        <div id="recentList"></div>

<script>
// ==================== 全域設定與狀態 ====================
const API_URL = 'https://script.google.com/macros/s/AKfycbzr7DIlHyO81RHvCX5WKbbs0Rj3q4BziyNQBOvqYnlFg8aGXfIvrAgPbgB_rNC30lqhIw/exec';
const APP_BUILD = '2026-10-18c'; // 每次改完程式碼就手動改這串,用來讓「更新」徽章知道程式碼換過了

let rawData = [];
let activeFilter = null;
let voiceHits = null; // 語音查詢的結果(依相似度排序);不是 null 時,清單就顯示這個
let voiceMsg = '';
let voiceWarn = ''; // 語音查詢沒說劑量、但有好幾種劑量時的紅字提醒
let activeCode = null;
let editing = false;
let saving = false;
let lastMergeTime = '';

// ==================== 放置區 / 狀態 判斷工具 ====================
const DISCONTINUED_STATUSES = ['已剔除', '暫停使用'];
const STATUS_SHORT = { '已剔除': '剔除', '暫停使用': '暫停' };
function isDiscontinued(item) {
  return DISCONTINUED_STATUSES.includes(item['狀態']);
}
function shortStatus(item) {
  return STATUS_SHORT[item['狀態']] || item['狀態'] || '';
}

// ==================== 首頁畫面切換(空白首頁 ↔ 搜尋結果) ====================
function updateHomeView() {
  const hasQuery = !!(document.getElementById('search').value || '').trim();
  const showResults = hasQuery || activeFilter !== null;
  document.getElementById('emptyState').style.display = showResults ? 'none' : 'flex';
  document.getElementById('resultsState').style.display = showResults ? 'flex' : 'none';
  document.getElementById('homeInner').style.justifyContent = showResults ? 'flex-start' : 'center';
  document.getElementById('homeBtn').style.display = showResults ? 'flex' : 'none';
  const mrow = document.getElementById('modeRow'); if (mrow) mrow.classList.toggle('on-results', showResults); // 模式按鈕只在首頁出現
  if (!showResults) renderRecent();
}

function setFilter(name) {
  voiceHits = null; voiceMsg = '';
  activeFilter = name;
  document.getElementById('search').value = '';
  renderCats();
  renderList();
  updateHomeView();
  closeDrawer();
}

// ==================== 最近查詢紀錄 ====================
const RECENT_KEY = 'recent_codes';
function getRecent() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch(e) { return []; }
}
function addRecent(code) {
  try {
    let list = getRecent().filter(function(c){ return c !== code; });
    list.unshift(code);
    list = list.slice(0, 5);
    localStorage.setItem(RECENT_KEY, JSON.stringify(list));
  } catch(e) {}
}
function renderRecent() {
  const box = document.getElementById('recentList');
  const codes = getRecent();
  box.innerHTML = '';
  if (codes.length === 0) {
    box.innerHTML = '<p class="recent-empty">還沒有查詢紀錄</p>';
    return;
  }
  codes.forEach(function(code) {
    const item = findItem(code);
    if (!item) return;
    const row = document.createElement('div');
    row.className = 'recent-item';
    row.innerHTML = '<span class="tag tag-code">' + code + '</span><span class="rname">' + (item['俗名'] || '（未命名）') + '</span>';
    row.addEventListener('click', function(){ openDetail(code); });
    box.appendChild(row);
  });
}
document.getElementById('clearRecentBtn').addEventListener('click', function(){
  if (!confirm('清除全部最近查詢紀錄？')) return;
  try { localStorage.removeItem(RECENT_KEY); } catch(e) {}
  renderRecent();
});

// ==================== 首頁快速篩選磁磚(調劑檯/專調檯/兒科檯) ====================
function startsWithAny(str, prefixes) {
  const s = String(str || '').toUpperCase();
  return prefixes.some(function(p){ return s.startsWith(p); });
}
const CHIPS = [
  { name: '調劑檯', label: '調劑檯' },
  { name: '專調檯', label: '專調檯' },
  { name: '兒科檯', label: '兒科檯' },
  { name: '急診檯', label: '急診檯' }
];
function renderChips() {
  const box = document.getElementById('chipGrid');
  box.innerHTML = '';
  CHIPS.forEach(function(c) {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.innerHTML = '<span>' + c.label + '</span>';
    btn.addEventListener('click', function(){ setFilter(c.name); });
    box.appendChild(btn);
  });
}
renderChips();

// ==================== 更新提示徽章(程式碼有改版 / HIS 合併過) ====================
const SEEN_BUILD_KEY = 'seen_app_build';
const SEEN_MERGE_KEY = 'seen_merge_time';

let pendingBuild = null; // 檢查到網站上有比目前更新的程式版本時,記在這裡(還沒套用)
function getUpdateCount() {
  let count = 0;
  if (pendingBuild) count++;
  else try {
    if (localStorage.getItem(SEEN_BUILD_KEY) !== APP_BUILD) count++;
  } catch(e) {}
  try {
    if (lastMergeTime && localStorage.getItem(SEEN_MERGE_KEY) !== lastMergeTime) count++;
  } catch(e) {}
  return count;
}
function renderUpdateBadge() {
  const n = getUpdateCount();
  [document.getElementById('edgeBadge'), document.getElementById('rowBadge')].forEach(function(el){
    if (!el) return;
    if (n > 0) { el.style.display = 'flex'; el.textContent = String(n); }
    else { el.style.display = 'none'; }
  });
}
function markUpdatesSeen() {
  try {
    localStorage.setItem(SEEN_BUILD_KEY, APP_BUILD);
    if (lastMergeTime) localStorage.setItem(SEEN_MERGE_KEY, lastMergeTime);
  } catch(e) {}
  renderUpdateBadge();
}
renderUpdateBadge();

// ==================== 畫面切換 / 錯誤提示 / 登入 ====================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showErrModal(msg) {
  document.getElementById('errModalMsg').textContent = msg;
  document.getElementById('errModal').style.display = 'flex';
}
document.getElementById('errModalOk').addEventListener('click', () => {
  document.getElementById('errModal').style.display = 'none';
});

// ==================== 資料格式處理工具(物品碼比對、放置區預設值) ====================
function normalizeCode(code) {
  return String(code || '').replace(/^\*/, '').trim().toLowerCase();
}
function validLoc2(val) {
  const s = String(val || '').trim();
  if (!s) return '';
  return /^[A-Za-z]/.test(s) ? s : '';
}
function displayPlace(item) {
  const manual = item['放置區'] || '';
  if (manual) return manual;
  return validLoc2(item['次料位號']);
}

// ==================== 從 Google 試算表讀取資料 ====================
let statusHideTimer = null;
async function fetchData() {
  const statusEl = document.getElementById('statusText');
  const statusBarEl = document.getElementById('statusBar');
  clearTimeout(statusHideTimer);
  statusBarEl.classList.remove('faded');
  statusEl.textContent = '更新中…';
  let success = false;
  try {
    const res = await fetch(API_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('連線失敗');
    const payload = await res.json();
    const rows = Array.isArray(payload) ? payload : (payload.rows || []);
    const mergeTime = Array.isArray(payload) ? '' : ((payload.meta && payload.meta.mergeTime) || '');
    rawData = rows;
    lastMergeTime = mergeTime;
    try {
      localStorage.setItem('med_data_cache', JSON.stringify(rows));
      localStorage.setItem('med_data_time', String(Date.now()));
      if (mergeTime) localStorage.setItem('last_merge_time_cache', mergeTime);
    } catch(e) {}
    const now = new Date();
    statusEl.textContent = '已更新 ' + now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
    success = true;
    // 更新成功後,「已更新 時:分」連同旁邊的箭頭顯示 3 秒就一起淡出;失敗/離線的提示則一直保留
    statusHideTimer = setTimeout(function() { statusBarEl.classList.add('faded'); }, 3000);
  } catch(err) {
    try {
      const cached = localStorage.getItem('med_data_cache');
      if (cached) {
        rawData = JSON.parse(cached);
        lastMergeTime = localStorage.getItem('last_merge_time_cache') || '';
        const t = localStorage.getItem('med_data_time');
        statusEl.textContent = t ? ('離線資料（上次更新 ' + new Date(+t).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}) + '）') : '離線資料';
      } else {
        statusEl.textContent = '無法連線，且無離線資料';
      }
    } catch(e) { statusEl.textContent = '無法連線'; }
  }
  renderCats();
  renderList();
  updateHomeView();
  renderUpdateBadge();
  return success;
}

// ==================== 程式本身的更新 ====================
// 向網站要最新的 index.html(不看手機存的快取),比對裡面的 APP_BUILD。
//  - apply=false(打開 App、切回 App 時的悄悄檢查):發現新版只亮紅點,不會自己換,等你按「更新」。
//  - apply=true(你按「更新」或下拉更新):發現新版就清掉舊快取並重新載入。
// 回傳 true 代表正在重新載入(呼叫的人就不用再做別的事)。
let lastSilentCheck = 0;
async function checkAppUpdate(apply) {
  try {
    const res = await fetch('index.html?cb=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return false;
    const m = (await res.text()).match(/const APP_BUILD = '([^']+)'/);
    if (!m) return false;
    if (m[1] === APP_BUILD) { pendingBuild = null; renderUpdateBadge(); return false; }
    if (!apply) { pendingBuild = m[1]; renderUpdateBadge(); return false; }
    // 防止無限重新載入:同一個新版本 2 分鐘內只試一次(例如 GitHub 的新檔案還沒完全準備好)
    let last = null;
    try { last = JSON.parse(localStorage.getItem('app_update_try') || 'null'); } catch (e) {}
    if (last && last.build === m[1] && Date.now() - last.t < 120000) {
      showErrModal('發現新版本,但還沒載入成功,請過一兩分鐘再按一次「更新」。');
      return false;
    }
    try {
      localStorage.setItem('app_update_try', JSON.stringify({ build: m[1], t: Date.now() }));
      localStorage.setItem(SEEN_BUILD_KEY, m[1]); // 換成新版後,紅點就不再為「這個新版」亮起
    } catch (e) {}
    document.getElementById('statusBar').classList.remove('faded');
    document.getElementById('statusText').textContent = '發現新版本,更新中…';
    if (window.caches) { const keys = await caches.keys(); await Promise.all(keys.map(function(k){ return caches.delete(k); })); }
    if (navigator.serviceWorker) { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(function(r){ return r.unregister(); })); }
    location.reload();
    return true;
  } catch (e) { return false; } // 沒網路或查不到,就當作沒有新版,照原本流程只更新資料
}
function silentCheckAppUpdate() {
  if (Date.now() - lastSilentCheck < 30000) return; // 30 秒內不重複檢查
  lastSilentCheck = Date.now();
  checkAppUpdate(false);
}
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'visible') silentCheckAppUpdate(); // 從背景切回 App 時檢查
});

// ==================== 篩選條件定義、清單排序與渲染 ====================
const FILTERS = [
  { name: '調劑檯', test: function(d){ return startsWithAny(d['料位號'], ['GZ', 'GX', 'GY']); } },
  { name: '專調檯', test: function(d){ return startsWithAny(d['料位號'], ['LX', 'LZ', 'LYA', 'LYB']); } },
  { name: '兒科檯', test: function(d){ return startsWithAny(d['料位號'], ['PX', 'PZ']); } },
  { name: '急診檯', test: function(d){ return startsWithAny(d['料位號'], ['AZ', 'BX', 'BY', 'BZ', 'CX', 'CY', 'CZ', 'ZE']); } },
  { name: '覆核發藥檯', test: function(d){ return startsWithAny(d['料位號'], ['KX', 'KZ']); } },
  { name: '諮詢檯', test: function(d){ return String(d['料位號'] || '').trim() === '諮詢'; } },
  { name: '冰箱藥品', test: function(d){ return startsWithAny(d['料位號'], ['RA', 'RB', 'RC']); } }
];
const MENU_GROUPS = [
  ['調劑檯', '專調檯', '兒科檯', '急診檯'],
  ['覆核發藥檯', '諮詢檯', '冰箱藥品']
];

function currentList() {
  if (voiceHits) return voiceHits;
  let items = rawData;
  const filter = FILTERS.find(function(f){ return f.name === activeFilter; });
  if (filter) items = items.filter(filter.test);
  const q = (document.getElementById('search').value || '').trim().toLowerCase();
  if (q) {
    const qNorm = q.replace(/^\*/, '');
    items = items.filter(function(d) {
      const codeNorm = normalizeCode(d['物品碼']);
      return (d['俗名']||'').toLowerCase().includes(q) ||
             (d['品名與內含量']||'').toLowerCase().includes(q) ||
             (d['學名']||'').toLowerCase().includes(q) ||
             (String(d['料位號']||'')).toLowerCase().includes(q) ||
             (String(d['次料位號']||'')).toLowerCase().includes(q) ||
             codeNorm.includes(qNorm);
    });
  } else {
    items = items.filter(function(d){ return !isDiscontinued(d); });
  }
  items = items.slice().sort(function(a, b){
    return String(a['料位號'] || '').localeCompare(String(b['料位號'] || ''), undefined, { numeric: true, sensitivity: 'base' });
  });
  return items;
}

function escRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function highlightText(text, q) {
  const s = String(text || '');
  if (!q) return s;
  const re = new RegExp('(' + escRegex(q) + ')', 'ig');
  return s.replace(re, '<mark style="background:#FBE9A0;color:inherit;padding:0 1px;border-radius:2px;">$1</mark>');
}
function matchedHiddenFieldLine(d, q) {
  if (!q) return '';
  const ql = q.toLowerCase();
  const qNorm = ql.replace(/^\*/, '');
  const codeNorm = normalizeCode(d['物品碼']);
  const visibleMatch =
    (d['俗名']||'').toLowerCase().includes(ql) ||
    (d['品名與內含量']||'').toLowerCase().includes(ql) ||
    (String(d['料位號']||'')).toLowerCase().includes(ql) ||
    codeNorm.includes(qNorm);
  if (visibleMatch) return '';
  const generic = d['學名'] || '';
  if (generic.toLowerCase().includes(ql)) {
    return '<p class="match-hint">學名:' + highlightText(generic, q) + '</p>';
  }
  const loc2 = String(d['次料位號'] || '');
  if (loc2.toLowerCase().includes(ql)) {
    return '<p class="match-hint">次料位號:' + highlightText(loc2, q) + '</p>';
  }
  return '';
}

function renderList() {
  const items = currentList();
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (voiceHits && voiceMsg) {
    const vm = document.createElement('div');
    vm.className = 'voice-msg';
    vm.textContent = voiceMsg;
    list.appendChild(vm);
    if (voiceWarn) {
      const vw = document.createElement('div');
      vw.className = 'voice-msg voice-warn';
      vw.textContent = voiceWarn;
      list.appendChild(vw);
    }
  }
  if (items.length === 0) {
    list.insertAdjacentHTML('beforeend', '<p class="empty-msg">找不到符合的藥品</p>');
    return;
  }
  const q = (document.getElementById('search').value || '').trim();
  items.forEach(function(d) {
    const code = d['物品碼'];
    const place = displayPlace(d);
    const discontinued = isDiscontinued(d);
    const row = document.createElement('div');
    row.className = 'item-row' + (discontinued ? ' muted' : '');
    row.innerHTML =
      '<div class="name-row">' +
        '<span class="tag tag-code">' + highlightText(code, q) + '</span>' +
        '<p class="name">' + highlightText(d['俗名'] || '（未命名）', q) + '</p>' +
      '</div>' +
      '<p class="full">' + highlightText(d['品名與內含量'] || '', q) + '</p>' +
      matchedHiddenFieldLine(d, q) +
      '<div class="tags">' +
        '<span class="tag tag-loc">' + highlightText(d['料位號'] || '未設定', q) + '</span>' +
        '<span class="tag ' + (place ? 'tag-place-set' : 'tag-place-unset') + '">藥櫃區:' + (place || '尚未設定') + '</span>' +
        (discontinued ? '<span class="tag tag-status">' + shortStatus(d) + '</span>' : '') +
      '</div>';
    row.addEventListener('click', function(){ openDetail(code); });
    list.appendChild(row);
  });
}
document.getElementById('search').addEventListener('input', function(){
  voiceHits = null; voiceMsg = '';
  renderList();
  updateHomeView();
});

// ==================== 選單抽屜(篩選項目、更新、拖曳開合) ====================
function renderCats() {
  const box = document.getElementById('cats');
  box.innerHTML = '';
  MENU_GROUPS.forEach(function(group, groupIdx) {
    if (groupIdx > 0) {
      const div = document.createElement('div');
      div.className = 'divider';
      div.style.margin = '8px 18px';
      box.appendChild(div);
    }
    group.forEach(function(name) {
      const f = FILTERS.find(function(x){ return x.name === name; });
      const n = rawData.filter(f.test).length;
      const btn = document.createElement('button');
      btn.className = 'cat-row' + (activeFilter === f.name ? ' active' : '');
      btn.innerHTML = '<span class="label">' + f.name + '</span><span class="n">' + n + '</span>';
      btn.addEventListener('click', function(){ setFilter(f.name); });
      box.appendChild(btn);
    });
  });
}

// ==================== 掃碼語音(掃描藥袋 QR → 唸出料位號與中文名) ====================
(function() {
  const scanScreen = document.getElementById('scanScreen');
  const scanInput = document.getElementById('scanInput');
  const resultBox = document.getElementById('scanResult');
  const histBox = document.getElementById('scanHistory');
  const startBtn = document.getElementById('scanStartBtn');
  let listening = false, manual = false, idleTimer = null, history = [], wakeLock = null;
  const lockMsg = document.getElementById('scanLockMsg');
  const manualBtn = document.getElementById('scanManualBtn');

  // 去掉俗名最前面的劑量括號,例如「(15mL)愛爾卡因點眼液(自費)」→「愛爾卡因點眼液(自費)」
  function cleanName(s) {
    const orig = String(s || '').trim();
    let t = orig, prev;
    do { prev = t; t = t.replace(/^[\(（][^\)）]*[\)）]\s*/, ''); } while (t !== prev);
    return t.trim() || orig;
  }
  // 字母唸法:大多數字母照原本唸;唸起來會混的字母改用中文字(之後有字母唸錯,把它加進這張表就好)。資料裡有「/」時只唸第一個
  const LETTER_SAY = { X: '叉', Z: '力', L: '欸摟', B: '嗶' };
  function spellLoc(loc) {
    const first = String(loc || '').split('/').map(function(x){ return x.trim(); }).filter(Boolean)[0] || '';
    // 一個字一個字處理:英文字母數字照規則換音,中文字(例如「共」)和符號原樣保留,避免整串被當成英文唸
    return first.split('').filter(function(c){ return !/\s/.test(c); }).map(function(c){ return LETTER_SAY[c.toUpperCase()] || c; }).join(' ');
  }
  // 藥包機:料位號以 AA 開頭的藥,由藥包機自動包藥,發籃子時要順便放進籃子
  function isPacker(item) {
    return /^AA/i.test(String(item['料位號'] || '').split('/')[0].trim());
  }
  // 俗名最前面括號裡的劑量,例如「(40mg/tab)立普妥」→「40mg/tab」
  function doseText(item) {
    const m = String(item['俗名'] || '').match(/^\s*[\(（]([^\)）]*)[\)）]/);
    return m ? m[1].trim() : '';
  }
  function unitSay(t) {
    return String(t).replace(/(\d+(?:\.\d+)?)\s*%/g, '百分之$1').replace(/mcg|μg|ug/gi, '微克').replace(/mg/gi, '毫克')
      .replace(/ml/gi, '毫升').replace(/(\d)\s*g\b/gi, '$1公克').replace(/\bIU\b/gi, '單位').replace(/[;；]/g, '，');
  }
  function doseSay(item) {
    return doseText(item).split('/').map(function(x){ return x.trim(); })
      .filter(function(x){ return x && !/^(tab|cap|btl|vial|amp|錠|膠囊|瓶|支)/i.test(x); }).map(unitSay).join('、');
  }
  // 報讀內容:藥包機 →「藥包機,藥名,請核對包數」;其他 →「料位號,藥名」(withDose 為真才加劑量)
  // UD 專用區欄位(試算表最右邊自己加的欄,標題要叫「UD少用藥區」)
  function udSpecial(item) {
    const v = String(item['UD少用藥區'] || '').trim();
    if (!v) return '';
    return /^[VvYy1是○✓✔]$/.test(v) ? '少用藥區' : v; // 只打記號就唸「少用藥區」,打字就照唸
  }
  // UD 模式的料位號:「/」後面那段;沒有「/」就用前面調劑檯的
  function udLoc(item) {
    const segs = String(item['料位號'] || '').split('/').map(function(x){ return x.trim(); }).filter(Boolean);
    return segs.length > 1 ? segs[1] : (segs[0] || '');
  }
  // 讀音替換表:只改「唸出來的字」,畫面上的藥名不變。左邊是藥名裡的字,右邊是唸的時候換成的字。
  const SPEECH_FIX = { '樂': '仂' };
  function speechName(n) {
    return String(n).replace(/./g, function(c){ return SPEECH_FIX[c] || c; });
  }
  function buildSay(item, withDose, ud) {
    const name = speechName(cleanName(item['俗名']) || cleanName(item['品名與內含量']) || '');
    if (ud) {
      const sp = udSpecial(item);
      if (sp) return sp + '，' + name;
      if (!isPacker(item)) return (spellLoc(udLoc(item)) || '無料位號') + '，' + name + (withDose && doseSay(item) ? '，' + doseSay(item) : '');
    }
    if (isPacker(item)) return '藥包機，' + name + '，請核對包數';
    const loc = String(item['料位號'] || '').trim();
    return (spellLoc(loc) || '無料位號') + '，' + name + (withDose && doseSay(item) ? '，' + doseSay(item) : '');
  }
  // QR 內容是網址 https://www2.cch.org.tw/Mdrug/MTACMH-O718651484#1,藥品碼就是 /Mdrug/ 後、「-」前的那段
  function parseCode(text) {
    const t = String(text || '').trim();
    const m = t.match(/Mdrug\/([A-Za-z0-9]+)/i);
    if (m) return m[1];
    const t2 = t.replace(/\s+/g, '');
    if (/^[A-Za-z0-9*]{3,12}$/.test(t2)) return t2;
    return null;
  }
  // 資料庫的物品碼是「*」開頭(例如 *TACMH),QR 裡的藥品碼是 M 開頭(MTACMH),所以拿掉第一個字母再比
  function findByScanCode(code) {
    const c1 = normalizeCode(code.slice(1)), c2 = normalizeCode(code);
    return rawData.find(function(d){ return normalizeCode(d['物品碼']) === c1; }) ||
           rawData.find(function(d){ return normalizeCode(d['物品碼']) === c2; });
  }

  // 手動輸入料位號(例如 AA239)時,用料位號找(次料位號不比對,只比「/」分開的每一段)
  function findByLoc(text) {
    const t = String(text || '').replace(/\s+/g, '').toLowerCase();
    if (!t) return null;
    return rawData.find(function(d){
      return String(d['料位號'] || '').split('/').some(function(seg){ return seg.replace(/\s+/g, '').toLowerCase() === t; });
    }) || null;
  }

  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  const twice = true; // 固定唸兩次
  const RATES = [{ n: '慢', v: 0.7 }, { n: '中', v: 0.85 }, { n: '快', v: 1.0 }];
  let rateIdx = Math.min(2, Math.max(0, parseInt(lsGet('scan_rate', '0'), 10) || 0));
  let speakToken = 0;

  function langOf(v) { return String(v.lang || '').replace('_', '-').toLowerCase(); }
  function isCantonese(v) { const l = langOf(v); return /yue|hk|zh-hk/.test(l) || /粵|廣東|cantonese|香港/i.test(v.name || ''); }
  function zhVoices() {
    if (!window.speechSynthesis) return [];
    return speechSynthesis.getVoices().filter(function(v){ return /^(zh|cmn|yue)/.test(langOf(v)); });
  }
  // 自動選語音:台灣國語優先 → 其他國語 → 都沒有就只指定 zh-TW 讓系統自己選。永遠排除粵語/香港。
  function autoVoice() {
    const ok = zhVoices().filter(function(v){ return !isCantonese(v); });
    const tw = ok.filter(function(v){ return /tw|hant/.test(langOf(v)); });
    const pool = tw.length ? tw : ok;
    return pool.find(function(v){ return v.localService; }) || pool[0] || null;
  }
  function pickVoice() { return autoVoice(); }
  function utter(text) {
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'zh-TW'; }
    u.rate = RATES[rateIdx].v;
    return u;
  }
  function speak(text, once, onStart) {
    if (!window.speechSynthesis) return;
    const token = ++speakToken; // 有新的掃描或點擊時,舊的(含第二次)就不再唸
    speechSynthesis.cancel();
    const u1 = utter('，，' + text);
    if (onStart) u1.onstart = function() { u1.onstart = null; onStart(); }; // 開頭墊一小段停頓:喇叭/耳機剛醒來會吃掉前 1、2 個字,第二遍不需要
    if (twice && !once) {
      u1.onend = function() {
        setTimeout(function() { if (token === speakToken) speechSynthesis.speak(utter(text)); }, 400);
      };
    }
    speechSynthesis.speak(u1);
  }
  // iPhone 規定:一定要在「手指點擊」當下先出過一次聲音,之後(例如語音辨識完)程式才能自己開口。這裡用音量 0 的空白字先解鎖。
  function unlockSpeech() {
    try {
      if (!window.speechSynthesis) return;
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  const rateBtn = document.getElementById('scanRateBtn');
  function showRate() { rateBtn.textContent = '語速:' + RATES[rateIdx].n; }
  rateBtn.addEventListener('click', function() {
    rateIdx = (rateIdx + 1) % RATES.length; lsSet('scan_rate', String(rateIdx)); showRate();
    speak(spellLoc('GZA01') + '，愛舒疼錠', true); // 切換後立刻試聽
  });
  showRate();
  if (window.speechSynthesis) speechSynthesis.getVoices(); // 先觸發語音清單載入(手機的語音是慢慢載入的)

  function esc(s) { return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function renderHistory() {
    histBox.innerHTML = '';
    history.forEach(function(h) {
      const row = document.createElement('div');
      row.className = 'scan-hist-item' + (h.bad ? ' bad' : '');
      row.innerHTML = '<span class="t">' + h.time + '</span><span class="l">' + esc(h.loc) + '</span><span>' + esc(h.name) + '</span>';
      row.addEventListener('click', function(){ speak(h.say); });
      histBox.appendChild(row);
    });
  }
  function addHistory(entry) {
    const d = new Date();
    entry.time = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
    history.unshift(entry);
    if (history.length > 15) history.pop();
    renderHistory();
  }
  function revealResult() {
    resultBox.style.display = 'flex';
    document.getElementById('scanHint').style.display = 'none';
    document.querySelector('.scan-hist-title').style.display = 'block';
  }
  function showBad(msg, say) {
    revealResult();
    resultBox.className = 'bad';
    resultBox.innerHTML = '<div class="loc">' + esc(msg) + '</div>';
    speak(say);
    addHistory({ loc: '✕', name: msg, say: say, bad: true });
  }

  let tFirst = 0; // 計時用:掃描器打出第一個字的時間
  function handleScan(text) {
    const tDet = performance.now(), tF = tFirst || tDet; tFirst = 0;
    if (!rawData.length) { showBad('資料還沒載入', '資料還沒載入'); return; }
    const code = parseCode(text);
    if (!code) { showBad('讀不到藥品碼', '讀不到藥品碼'); return; }
    const item = findByScanCode(code) || findByLoc(text);
    if (!item) { showBad('查無此藥 ' + code, '查無此藥'); return; }
    const loc = String(item['料位號'] || '').trim();
    const name = cleanName(item['俗名']) || cleanName(item['品名與內含量']) || '';
    const packer = isPacker(item);
    const say = buildSay(item, false); // 掃碼一律不唸劑量(只在畫面顯示)
    revealResult();
    resultBox.className = '';
    const status = String(item['狀態'] || '').trim();
    const dose = doseText(item);
    resultBox.innerHTML = '<div class="loc">' + esc(packer ? '藥包機' : (loc || '無料位號')) + '</div><div class="nm">' + esc(name) + '</div>' +
      (packer ? '<div class="warn">請核對包數(' + esc(loc) + ')</div>' : '') +
      (dose ? '<div class="st">劑量:' + esc(dose) + '</div>' : '') +
      (status ? '<div class="st">狀態:' + esc(status) + '</div>' : '');
    speak(say, false);
    addHistory({ loc: packer ? '藥包機' : (loc || '無'), name: name, say: say });
  }

  function flush() {
    clearTimeout(idleTimer);
    const text = scanInput.value.trim();
    scanInput.value = ''; // 掃完立刻清空,準備接收下一筆
    if (text) handleScan(text);
    if (listening) scanInput.focus();
  }

  // 掃描器是一個字一個字「打」進來的,網址後面那串(O718651484#1)我們用不到。
  // 藥品碼一出現(看到「-」)就立刻處理,剩下的字直接丟掉,不用等整串打完。
  let tail = false, tailTimer = null;
  function endTail() { tail = false; clearTimeout(tailTimer); }
  scanInput.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (tail) { scanInput.value = ''; endTail(); return; } // 這筆已經處理過了,Enter 只是結尾
    flush();
  });
  scanInput.addEventListener('input', function() {
    clearTimeout(idleTimer);
    if (!tail && !tFirst) tFirst = performance.now();
    if (tail) { // 剛處理完的那一筆還在打尾巴 → 丟掉,停頓 0.4 秒就算結束
      scanInput.value = '';
      clearTimeout(tailTimer); tailTimer = setTimeout(endTail, 400);
      return;
    }
    if (!manual && /Mdrug\/[A-Za-z0-9]+-/i.test(scanInput.value)) {
      const text = scanInput.value.trim();
      scanInput.value = '';
      tail = true; clearTimeout(tailTimer); tailTimer = setTimeout(endTail, 400);
      handleScan(text);
      return;
    }
    // 其他格式的條碼(沒有網址):沒送 Enter 時,停頓 0.4 秒也處理
    idleTimer = setTimeout(function() {
      if (/Mdrug\/[A-Za-z0-9]+-/i.test(scanInput.value)) flush();
    }, 400);
  });
  scanInput.addEventListener('blur', function() {
    if (listening && !manual && scanScreen.classList.contains('active')) setTimeout(function(){ scanInput.focus(); }, 150);
  });

  // 掃碼頁保持螢幕恆亮(離開掃碼頁就釋放)
  async function lockScreen() {
    try {
      if (!('wakeLock' in navigator)) { lockMsg.textContent = '不支援恆亮,請調長螢幕逾時'; return; }
      if (wakeLock) return;
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', function(){ wakeLock = null; });
      lockMsg.textContent = '螢幕恆亮已開啟';
    } catch (e) { wakeLock = null; lockMsg.textContent = '無法恆亮,請調長螢幕逾時'; }
  }
  function unlockScreen() {
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    wakeLock = null; lockMsg.textContent = '';
  }
  // 手機切到別的程式再切回來時,系統會自動放掉恆亮,這裡補回來
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible' && listening && scanScreen.classList.contains('active')) lockScreen();
  });

  manualBtn.addEventListener('click', function() {
    manual = !manual;
    scanInput.setAttribute('inputmode', manual ? 'text' : 'none');
    scanInput.setAttribute('type', manual ? 'text' : 'password'); // 掃描時用密碼欄位:手機會強制用英文,不會被注音輸入法轉成中文(網址欄位試過,擋不住注音)
    manualBtn.textContent = manual ? '關閉手動輸入' : '手動輸入測試';
    scanInput.placeholder = manual ? '輸入藥品碼(如 MTACMH)後按 Enter' : '掃描器會輸入到這裡';
    scanInput.blur();
    setTimeout(function(){ scanInput.focus(); }, 50);
  });

  startBtn.addEventListener('click', function() {
    // 瀏覽器規定要先有一次點擊才能發聲,所以每次進來都要按這個鈕
    if (!listening) speak('開始掃碼', true);
    listening = true;
    startBtn.classList.add('on');
    startBtn.textContent = '● 掃碼中(點這裡可重新對準)';
    lockScreen();
    scanInput.focus();
  });

  // ==================== 鏡頭掃碼(選用):用手機後鏡頭讀 QR,讀到後走跟掃碼機一樣的流程 ====================
  const camBtn = document.getElementById('scanCamBtn'), camBox = document.getElementById('camBox'), camV = document.getElementById('camV');
  const camFlash = document.getElementById('camFlash'), camMsg = document.getElementById('camMsg'), camZoom = document.getElementById('camZoom');
  const ZOOMS = [1, 1.5, 2, 3];
  let camStream = null, camTrack = null, camDet = null, camOn = false, camTimer = null, camLast = '', camSeen = 0, camLastRead = 0, camZoomCap = null;
  let zoomIdx = Math.min(ZOOMS.length - 1, Math.max(0, parseInt(lsGet('scan_zoom', '0'), 10) || 0));
  const CAM_IDLE_MS = 90000; // 90 秒沒掃到東西就讓鏡頭休息省電
  function camPaint() {
    camBtn.classList.toggle('on', camOn);
    camBtn.textContent = camOn ? '鏡頭:開' : '鏡頭';
    camBox.style.display = camOn ? 'block' : 'none';
  }
  function stopCam(msg) {
    camOn = false; clearTimeout(camTimer);
    if (camStream) camStream.getTracks().forEach(function(t){ t.stop(); });
    camStream = null; camTrack = null; camV.srcObject = null; camZoomCap = null; camZoom.style.display = 'none';
    camMsg.textContent = msg || '';
    camPaint();
  }
  async function applyZoom() {
    if (!camTrack || !camZoomCap) return;
    const z = Math.min(camZoomCap.max, Math.max(camZoomCap.min, ZOOMS[zoomIdx]));
    try { await camTrack.applyConstraints({ advanced: [{ zoom: z }] }); } catch (e) {}

  }
  async function startCam() {
    if (camOn) return;

    if (!('BarcodeDetector' in window)) { camMsg.textContent = '這個瀏覽器不支援鏡頭掃碼,請用 Chrome(Android)'; return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { camMsg.textContent = '這個瀏覽器不能開鏡頭'; return; }
    try {
      const f = await BarcodeDetector.getSupportedFormats();
      if (f.indexOf('qr_code') < 0) { camMsg.textContent = '這支手機的瀏覽器讀不了 QR'; return; }
      camDet = new BarcodeDetector({ formats: ['qr_code'] });
      camStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } });
    } catch (e) {
      camMsg.textContent = (e && e.name === 'NotAllowedError') ? '沒有相機權限:網址列左邊的鎖頭 → 權限 → 相機 → 允許' : '開不了鏡頭';
      return;
    }
    camTrack = camStream.getVideoTracks()[0];
    camV.srcObject = camStream;
    try { await camV.play(); } catch (e) {}
    const cap = (camTrack.getCapabilities && camTrack.getCapabilities()) || {};
    try { if (cap.focusMode && cap.focusMode.indexOf('continuous') >= 0) await camTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
    camZoomCap = cap.zoom || null;
    camZoom.style.display = camZoomCap ? 'block' : 'none';
    applyZoom();
    camOn = true; camLast = ''; camSeen = 0; camLastRead = performance.now();
    camPaint();
    camLoop();
  }
  async function camLoop() {
    if (!camOn) return;
    if (!scanScreen.classList.contains('active') || document.visibilityState !== 'visible') { stopCam(''); return; } // 離開掃碼頁或切到別的程式就關鏡頭
    const now = performance.now();

      if (camV.readyState >= 2) {

          const text = r[0].rawValue, t = performance.now();
          camLastRead = t;
          if (text === camLast && t - camSeen < 1000) { camSeen = t; } // 同一張 QR 還在畫面裡,不重複唸
          else {
            camLast = text; camSeen = t;
            camFlash.style.opacity = 1; setTimeout(function(){ camFlash.style.opacity = 0; }, 250);
            if (navigator.vibrate) navigator.vibrate(50);
            handleScan(text);
          }
        }
      }
    } catch (e) {}
    camTimer = setTimeout(camLoop, 90);
  }
  camBtn.addEventListener('click', function() {
    if (camOn) { lsSet('scan_cam', '0'); stopCam(''); return; }
    lsSet('scan_cam', '1');
    if (!listening) startBtn.click(); // 先照一般流程「開始掃碼」(要有一次點擊,手機才讓程式出聲),它會順便開鏡頭
    else startCam();
  });
  camZoom.addEventListener('click', function() { zoomIdx = (zoomIdx + 1) % ZOOMS.length; lsSet('scan_zoom', String(zoomIdx)); applyZoom(); });
  startBtn.addEventListener('click', function() { if (lsGet('scan_cam', '0') === '1') startCam(); });
  camPaint();

  document.getElementById('scanBtn').addEventListener('click', function() {
    closeDrawer();
    listening = false; stopCam('');
    manual = false; scanInput.setAttribute('inputmode', 'none'); scanInput.setAttribute('type', 'password'); manualBtn.textContent = '手動輸入測試'; scanInput.placeholder = '掃描器會輸入到這裡';
    startBtn.classList.remove('on');
    startBtn.textContent = '開始掃碼';
    showScreen('scanScreen');
    unlockSpeech();
    window.scrollTo({ top: 0 });
  });
  document.getElementById('scanBackBtn').addEventListener('click', function() {
    listening = false; stopCam('');
    unlockScreen();
    if (window.speechSynthesis) speechSynthesis.cancel();
    scanInput.blur();
    showScreen('homeScreen');
    updateHomeView();
  });

  if (window.speechSynthesis) speechSynthesis.getVoices(); // 先觸發語音清單載入
  window.__scanTest = { cleanName: cleanName, spellLoc: spellLoc, parseCode: parseCode };
  window.ScanVoice = { unlockSpeech: unlockSpeech, udSpecial: udSpecial, udLoc: udLoc, speak: speak, cleanName: cleanName, spellLoc: spellLoc, isPacker: isPacker, doseText: doseText, doseSay: doseSay, buildSay: buildSay };
})();

// ==================== 語音查詢(首頁搜尋框的麥克風:說藥名 → 依「讀音」比對 → 唸出料位號) ====================
(function() {
  const micBtn = document.getElementById('micBtn');
  const searchEl = document.getElementById('search');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return; // 這個瀏覽器不支援語音辨識(例如部分 iPhone),就不顯示麥克風
  micBtn.style.display = 'flex';
  // 語音模式:調劑(念調劑檯料位號) / UD(念「/」後面的料位號、少用藥區)
  const modeBtn = document.getElementById('modeBtn');
  let udMode = false;
  function paintMode() { modeBtn.textContent = udMode ? '模式:UD' : '模式:調劑'; modeBtn.classList.toggle('ud', udMode); }
  document.getElementById('modeRow').style.display = 'flex';
  paintMode();
  // 不記住 UD:每次重開都是調劑;切離 App 超過 1 分鐘再回來也恢復成調劑
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > 60000 && udMode) { udMode = false; paintMode(); }
    hiddenAt = 0;
  });
  modeBtn.addEventListener('click', function() {
    udMode = !udMode; paintMode();
  });

  // 轉成「不分聲調的拼音」,並把台灣口音容易混的音當成同一個(zh=z、ch=c、sh=s、ing=in、eng=en、n=l)
  function toSyllables(text) {
    const t = String(text || '');
    let arr;
    if (window.pinyinPro) {
      arr = window.pinyinPro.pinyin(t, { toneType: 'none', type: 'array', nonZh: 'removed' });
    } else {
      arr = t.replace(/[^一-鿿]/g, '').split(''); // 讀音工具沒載入時,退回逐字比對
    }
    return arr.map(function(x) {
      return x.replace(/^zh/, 'z').replace(/^ch/, 'c').replace(/^sh/, 's').replace(/ng$/, 'n').replace(/^n/, 'l');
    });
  }
  function initialOf(x) { const m = x.match(/^(b|p|m|f|d|t|l|g|k|h|j|q|x|z|c|s|r|y|w)/); return m ? m[1] : ''; }
  function subCost(a, b) {
    if (a === b) return 0;
    const ia = initialOf(a), ib = initialOf(b);
    if (ia === ib && ia !== '') return 0.5;                // 聲母相同
    if (ia !== '' && ib !== '' && a.slice(ia.length) === b.slice(ib.length)) return 0.5; // 韻母相同
    return 1;
  }
  // 把「你說的」整串對齊到「藥名」中任何一段,算出最小差異(例如說「愛舒疼」能對上「愛舒疼錠」)
  function matchCost(q, n) {
    const m = q.length, k = n.length;
    if (!m || !k) return m;
    let prev = new Array(k + 1).fill(0); // 藥名從任何位置開始都免費
    for (let i = 1; i <= m; i++) {
      const cur = new Array(k + 1);
      cur[0] = i;
      for (let j = 1; j <= k; j++) {
        cur[j] = Math.min(prev[j - 1] + subCost(q[i - 1], n[j - 1]), prev[j] + 1, cur[j - 1] + 1);
      }
      prev = cur;
    }
    return Math.min.apply(null, prev);
  }

  let lastScores = [];
  const NUM = ['', '一', '兩', '三', '四', '五', '六', '七', '八'];
  function searchByVoice(alts) {
    const qs = alts.map(toSyllables).filter(function(q){ return q.length >= 2; });
    if (!qs.length) return [];
    const scored = [];
    rawData.forEach(function(d) {
      const name = window.ScanVoice.cleanName(d['俗名']).replace(/[\(（][^\)）]*[\)）]/g, '');
      const ns = toSyllables(name);
      if (!ns.length) return;
      let best = 0;
      qs.forEach(function(q, idx) {
        const sc = 1 - matchCost(q, ns) / q.length - idx * 0.02; // 手機給的第 2、3…個備選答案,分數稍微打折
        if (sc > best) best = sc;
      });
      best -= 0.02 * Math.max(0, ns.length - qs[0].length) / ns.length; // 藥名越接近你說的長度越前面
      if (isDiscontinued(d)) best -= 0.05;
      if (best >= 0.6) scored.push({ d: d, score: best });
    });
    scored.sort(function(a, b){ return b.score - a.score; });
    lastScores = scored.slice(0, 8).map(function(x){ return x.score; });
    return scored.slice(0, 8).map(function(x){ return x.d; });
  }

  let rec = null, listening = false;
  const oldPlaceholder = searchEl.placeholder;
  function ui(on, hint) {
    listening = on;
    micBtn.classList.toggle('on', on);
    searchEl.placeholder = hint || oldPlaceholder;
  }

  // 把「立普妥 40」「立普妥四十毫克」拆成 藥名 + 劑量數字(只看句尾的數字)
  function cnNum(t) {
    if (/^\d+(\.\d+)?$/.test(t)) return parseFloat(t);
    const D = { '零': 0, '〇': 0, '一': 1, '二': 2, '兩': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
    const parts = t.split('點');
    function intPart(x) {
      if (!x) return 0;
      if (!/[十百千]/.test(x)) { let v = ''; for (const c of x) { if (!(c in D)) return NaN; v += D[c]; } return parseInt(v, 10); }
      let total = 0, cur = 0;
      for (const c of x) {
        if (c in D) cur = D[c];
        else if (c === '十') { total += (cur || 1) * 10; cur = 0; }
        else if (c === '百') { total += cur * 100; cur = 0; }
        else if (c === '千') { total += cur * 1000; cur = 0; }
        else return NaN;
      }
      return total + cur;
    }
    let n = intPart(parts[0]);
    if (parts[1]) { let f = ''; for (const c of parts[1]) { if (!(c in D)) return NaN; f += D[c]; } n += parseFloat('0.' + f); }
    return n;
  }
  function parseSpoken(text) {
    const t = String(text || '').trim();
    const m = t.match(/^(.*?)[\s,，]*((?:\d+(?:\.\d+)?)|(?:[零〇一二兩三四五六七八九十百千]+(?:點[零〇一二三四五六七八九]+)?))\s*(?:毫克|公克|克|毫升|mg|MG|ml|mL|%|百分比)?\s*$/);
    if (m && m[1].replace(/\s/g, '').length >= 2) {
      const n = cnNum(m[2]);
      if (!isNaN(n) && n > 0) return { name: m[1].trim(), dose: n };
    }
    return { name: t, dose: null };
  }
  function doseNumbers(d) { return (window.ScanVoice.doseText(d).match(/\d+(?:\.\d+)?/g) || []).map(parseFloat); }

  // 辨識還沒完全結束時,iPhone 的喇叭還被麥克風占著(會變很小聲或不出聲),所以等辨識結束再唸
  // Android 不用等,辨識結果一出來就唸;iPhone 才等辨識結束
  const IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let pendingSay = null, pendingTimer = null;
  let tSpeechEnd = 0, tResult = 0; // 計時用(毫秒)
  function deferSpeak(text, once) {
    pendingSay = { text: text, once: once };
    clearTimeout(pendingTimer);
    if (!IOS) { flushSay(); return; }
    pendingTimer = setTimeout(flushSay, 1500); // 保險:萬一 onend 沒來也會唸
  }
  function flushSay() {
    clearTimeout(pendingTimer);
    const p = pendingSay; pendingSay = null;
    if (!p) return;
    setTimeout(function(){ window.ScanVoice.speak(p.text, p.once); }, IOS ? 150 : 0);
  }
  function handle(alts) {
    const heard = alts[0];
    const parsed = alts.map(parseSpoken);
    const dose = parsed[0].dose;                     // 你有說劑量才會有值
    let hits = searchByVoice(parsed.map(function(x){ return x.name; }));
    const scores = lastScores.slice();
    const sv = window.ScanVoice;
    let msg = (udMode ? '[UD 模式] ' : '') + '聽到「' + heard + '」→ ';
    let doseMissing = false, withDose = false;

    if (dose !== null && hits.length) {
      const matched = hits.filter(function(d){ return doseNumbers(d).some(function(x){ return Math.abs(x - dose) < 1e-9; }); });
      if (matched.length) {
        hits = matched.concat(hits.filter(function(d){ return matched.indexOf(d) < 0; })); // 對的劑量排最前面,其餘留在畫面供核對
        withDose = true;
        msg += '藥名「' + parsed[0].name + '」、劑量 ' + dose + ' → 找到 ' + matched.length + ' 筆符合';
      } else {
        doseMissing = true;
        msg += '找到藥名,但沒有 ' + dose + ' 的劑量(其他劑量列在下面)';
      }
    } else {
      msg += hits.length ? '依讀音找到 ' + hits.length + ' 筆(最像的排最前面)' : '沒有找到相近的藥名';
    }

    voiceWarn = '';
    voiceHits = hits; voiceMsg = msg;
    searchEl.value = heard;
    renderList(); updateHomeView(); window.scrollTo({ top: 0 });

    if (!hits.length) { deferSpeak('找不到', true); return; }
    if (doseMissing) { deferSpeak('沒有這個劑量', true); return; }
    const top = hits[0];
    const topName = sv.cleanName(top['俗名']);
    let pre = '', post = '';
    // 讀音相近、但名字不同的藥(例如同音別字)→ 先提醒有幾筆
    const near = withDose ? [] : hits.filter(function(d, i){ return scores[i] !== undefined && scores[i] >= scores[0] - 0.03; });
    const names = {}; near.forEach(function(d){ names[sv.cleanName(d['俗名'])] = 1; });
    const nNames = Object.keys(names).length;
    if (nNames > 1) pre = '有' + NUM[Math.min(nNames, 8)] + '筆相近，第一筆：';
    // 同名、不同劑量:你沒說劑量時,提醒還有幾筆
    if (!withDose) {
      const sameItems = hits.filter(function(d){ return sv.cleanName(d['俗名']) === topName; });
      if (sameItems.length > 1) {
        post = '，請核對劑量';
        const doses = [];
        sameItems.forEach(function(d){ const t = (sv.doseText(d).split('/')[0] || '').trim(); if (t && doses.indexOf(t) < 0) doses.push(t); });
        voiceWarn = '有 ' + sameItems.length + ' 種劑量' + (doses.length ? '(' + doses.join('、') + ')' : '') + ',請核對';
        renderList();
      }
    }
    deferSpeak(pre + sv.buildSay(top, withDose, udMode) + post);
  }

  // 提示音:短短一聲(用瀏覽器自己合成,不用音檔)
  let actx = null;
  function beep() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.12;
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + 0.12);
    } catch (e) {}
  }
  micBtn.addEventListener('click', function() {
    try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) { if (!actx) actx = new AC(); if (actx.state === 'suspended') actx.resume(); } } catch (e) {} // 趁使用者點擊時先解鎖聲音
    if (listening) { try { rec.stop(); } catch (e) {} return; }
    if (!rawData.length) { showErrModal('資料還沒載入,請稍等一下再試'); return; }
    if (window.speechSynthesis) speechSynthesis.cancel(); // 避免手機把自己唸的聲音聽進去
    tSpeechEnd = 0; tResult = 0;
    window.ScanVoice.unlockSpeech(); // iPhone:趁點擊當下解鎖,辨識完才唸得出來
    pendingSay = null;
    rec = new SR();
    rec.lang = 'zh-TW';
    rec.interimResults = false;
    rec.continuous = false;
    rec.maxAlternatives = 5;
    let gotResult = false, gotError = false, retried = false, retryDone = false;
    rec.onstart = function() { ui(true, '準備中…'); };
    rec.onspeechend = function() { tSpeechEnd = performance.now(); };
    rec.onaudiostart = function() { ui(true, '請說藥名…'); beep(); }; // 麥克風真的開始收音才提示(iPhone 沒有系統叮聲,自己加)
    rec.onresult = function(e) {
      gotResult = true; tResult = performance.now();
      const alts = [];
      for (let i = 0; i < e.results[0].length; i++) alts.push(e.results[0][i].transcript);
      handle(alts);
    };
    rec.onerror = function(e) {
      gotError = true;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') showErrModal('麥克風沒有開啟權限。請到瀏覽器的網站設定,允許這個網站使用麥克風。');
      else if (e.error === 'network') showErrModal('語音辨識需要連上網路,請確認手機有網路。');
      else if (e.error === 'no-speech') ui(false, '沒聽到聲音,再按一次麥克風');
      else if (e.error === 'audio-capture') {
        // iPhone 常因為前一句語音還沒放完、麥克風被占住,稍等一下自動再試一次
        if (!retried) { retried = true; gotError = false; setTimeout(function(){ try { rec.start(); } catch (x) { ui(false); showErrModal('找不到麥克風,請確認沒有連著藍牙耳機,或稍後再按一次。'); } }, 500); return; }
        showErrModal('找不到麥克風,請確認耳機或手機麥克風可以使用。');
      }
    };
    rec.onend = function() {
      flushSay();
      if (retried && !gotResult && !gotError && !retryDone) { retryDone = true; return; }
      listening = false; micBtn.classList.remove('on');
      if (searchEl.placeholder === '請說藥名…' || searchEl.placeholder === '準備中…') searchEl.placeholder = oldPlaceholder;
      if (!gotResult && !gotError) ui(false, '沒聽到聲音,再按一次麥克風'); // iPhone 有時辨識會默默結束
    };
    try { rec.start(); } catch (e) { ui(false); }
  });

  window.__voiceTest = { searchByVoice: searchByVoice, toSyllables: toSyllables, handle: handle, parseSpoken: parseSpoken };
})();

function statusTags(item) {

  if (item['抗生']) tags.push('抗生素');

function renderDetail() {
  const item = findItem(activeCode);
  const body = document.getElementById('detailBody');
  if (!item) { body.innerHTML = '<p class="empty-msg">找不到這筆資料</p>'; return; }

  const loc2 = validLoc2(item['次料位號']);

  const tagsHtml = tags.map(function(t){ return '<span class="tag" style="background:#F1EFE8;color:#5F5E5A;">' + t + '</span>'; }).join(' ');

  function esc(v) { return String(v || '').replace(/"/g, '&quot;'); }
  function field(label, key, value, sub, readonly) {
    if (editing && !readonly) {
      return '<div class="field"><label>' + label + '</label><input id="f_' + key + '" value="' + esc(value) + '"></div>';
    }
    return '<div class="field"><label>' + label + '</label><div class="value' + (sub ? ' sub' : '') + '">' + (value || '（未填寫）') + '</div></div>';
  }

  body.innerHTML =
    field('俗名', 'alias', item['俗名']) +
    field('品名與內含量', 'full', item['品名與內含量'], true, true) +
    field('學名', 'generic', item['學名'], true, true) +
    '<div class="divider"></div>' +
    '<div class="field"><label>物品碼</label><div class="value">' + item['物品碼'] + '</div></div>' +
    field('料位號', 'loc', item['料位號'], false, true) +
    (loc2 ? field('次料位號', 'loc2', item['次料位號'], false, true) : '') +
    (tags.length ? '<div class="field"><label>狀態標籤</label><div class="tag-row-detail">' + tagsHtml + '</div></div>' : '') +
    (item['備註'] ? field('備註', 'note', item['備註'], true, true) : '') +
    '<div class="divider"></div>' +
    '<div class="field">' +
      '<label>藥櫃區</label>' +
      (editing
        ? '<input id="f_place" value="' + esc(place) + '">'
        : '<div class="value">' + (place ? '藥櫃區:' + place + (isManual ? '' : '<span style="font-size:12px;font-weight:400;color:#999;">（帶入次料位號，尚未確認）</span>') : '尚未設定') + '</div>'
      ) +
    '</div>' +
    '<button class="btn-save" id="editBtn">' + (editing ? (saving ? '儲存中…' : '儲存') : '編輯資料') + '</button>' +
    (editing ? '<p id="saveErr" style="color:#A32D2D;font-size:13px;text-align:center;margin-top:8px;"></p>' : '');

  document.getElementById('editBtn').addEventListener('click', function(){
    if (saving) return;
    if (!editing) {
      editing = true;
      renderDetail();
    } else {
      const fields = {
        '俗名': document.getElementById('f_alias').value.trim(),
        '放置區': document.getElementById('f_place').value.trim()
      };
      saveDetail(fields);
    }
  });
}

// ==================== 寫入資料回 Google 試算表(JSONP,避開 CORS) ====================
function jsonp(url) {
  return new Promise(function(resolve, reject) {
    const cbName = 'jsonpCb' + Date.now();
    const timeoutId = setTimeout(function() {
      cleanup();
      reject(new Error('逾時'));
    }, 10000);
    function cleanup() {
      clearTimeout(timeoutId);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function(data) {
      cleanup();
      resolve(data);
    };
    const script = document.createElement('script');
    script.src = url + '&callback=' + cbName;
    script.onerror = function() {
      cleanup();
      reject(new Error('載入失敗'));
    };
    document.body.appendChild(script);
  });
}

async function saveDetail(fields) {
  saving = true;
  renderDetail();
  try {
    const url = API_URL + '?action=save&code=' + encodeURIComponent(activeCode) + '&fields=' + encodeURIComponent(JSON.stringify(fields));
    const result = await jsonp(url);
    if (!result.success) throw new Error(result.error || '儲存失敗');
    const item = findItem(activeCode);
    if (item) {
      Object.keys(fields).forEach(function(k){ item[k] = fields[k]; });
    }
    saving = false;
    editing = false;
    renderDetail();
    renderCats();
    renderList();
    const toast = document.getElementById('saveToast');
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 1400);
  } catch (err) {
    saving = false;
    renderDetail();
    const errEl = document.getElementById('saveErr');
    if (errEl) errEl.textContent = '儲存失敗，請確認網路連線後再試一次';
  }
}

// ==================== PWA / Service Worker 註冊 ====================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

let edgeGestureActive = false; // 選單開合／詳細頁返回這兩個手勢進行中時設為 true,讓下拉刷新知道要先讓路,不要搶著觸發

// ==================== 手勢與導覽：左緣滑動(首頁開關選單／詳細頁跟手返回) ====================
(function() {
  let startX = 0, startY = 0, tracking = false, mode = null, wasOpen = false;
  const DRAWER_WIDTH = 250;
  const drawer = document.getElementById('drawer');
  const overlay = document.getElementById('overlay');
  const detailScreen = document.getElementById('detailScreen');
  const homeScreenEl = document.getElementById('homeScreen');

  function snapTo(open) {
    drawer.classList.remove('dragging');
    overlay.classList.remove('dragging');
    drawer.style.transform = '';
    overlay.style.opacity = '';
    if (open) { drawer.classList.add('open'); overlay.classList.add('open'); }
    else { drawer.classList.remove('open'); overlay.classList.remove('open'); }
  }

  function finishBack(complete) {
    detailScreen.classList.remove('dragging-live');
    if (complete) {
      detailScreen.style.transform = 'translateX(100%)';
      setTimeout(function(){
        showScreen('homeScreen');
        detailScreen.classList.remove('overlay-drag');
        detailScreen.style.transform = '';
        renderList();
      }, 300);
    } else {
      detailScreen.style.transform = 'translateX(0)';
      setTimeout(function(){
        detailScreen.classList.remove('overlay-drag');
        detailScreen.style.transform = '';
        homeScreenEl.classList.remove('active');
      }, 300);
    }
  }

  // 改成「任何位置橫向滑動」都能觸發(不再只限最左緣),避開安卓系統返回手勢吃掉邊緣觸控的問題
  let pending = false, active = false;
  // iPhone 維持原本順暢的「左緣跟手」做法;安卓改成任何位置橫向滑動都能觸發(避開系統返回手勢)
  const IS_IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const EDGE_ZONE = 24;
  if (!IS_IOS) document.documentElement.style.touchAction = 'pan-y';

  function reset() { pending = false; active = false; tracking = false; edgeGestureActive = false; }

  function activate() {
    active = true; tracking = true; edgeGestureActive = true;
    if (mode === 'back') {
      homeScreenEl.classList.add('active');
      detailScreen.classList.add('overlay-drag', 'dragging-live');
    } else {
      drawer.classList.add('dragging');
      overlay.classList.add('dragging', 'open');
    }
  }

  document.addEventListener('touchstart', function(e) {
    reset();
    if (e.touches.length !== 1) return;
    const homeActive = homeScreenEl.classList.contains('active');
    const detailActive = detailScreen.classList.contains('active');
    if (!homeActive && !detailActive) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    const t = e.touches[0];
    if (detailActive) {
      mode = 'back';
    } else {
      const isOpen = drawer.classList.contains('open');
      if (isOpen && t.clientX > DRAWER_WIDTH) return; // 觸控點不在選單面板上,交給遮罩點擊處理
      mode = 'drawer';
      wasOpen = isOpen;
    }
    startX = t.clientX; startY = t.clientY;
    if (IS_IOS) {
      const inZone = (mode === 'drawer' && wasOpen) ? true : t.clientX <= EDGE_ZONE;
      if (!inZone) return;
      activate();
      return;
    }
    pending = true;
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (!pending && !active) return;
    const t = e.touches[0];
    const dx = t.clientX - startX;
    const ady = Math.abs(t.clientY - startY);

    if (pending) {
      const adx = Math.abs(dx);
      if (adx < 8 && ady < 8) return;
      const horizontal = adx > ady * 1.2;
      const rightOk = (mode === 'back') || !wasOpen ? dx > 0 : dx < 0; // 返回/開選單要往右;關選單要往左
      if (!horizontal || !rightOk) { pending = false; return; } // 垂直或方向不對 → 交還給一般捲動
      pending = false;
      activate();
    }

    if (ady > 60 && ady > Math.abs(dx)) { // 垂直手勢 → 取消並歸位
      const m = mode, wo = wasOpen;
      reset();
      if (m === 'back') finishBack(false); else snapTo(wo);
      return;
    }

    if (mode === 'back') {
      if (dx <= 0) return;
      if (e.cancelable) e.preventDefault();
      detailScreen.style.transform = 'translateX(' + Math.min(dx, window.innerWidth) + 'px)';
      return;
    }

    if (e.cancelable) e.preventDefault();
    const base = wasOpen ? DRAWER_WIDTH : 0;
    const current = Math.max(0, Math.min(base + dx, DRAWER_WIDTH));
    drawer.style.transform = 'translateX(' + (current - DRAWER_WIDTH) + 'px)';
    overlay.style.opacity = String(current / DRAWER_WIDTH);
  }, { passive: false });

  document.addEventListener('touchend', function(e) {
    if (!active) { pending = false; return; }
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    reset();

    if (mode === 'back') {
      finishBack(Math.max(0, dx) > window.innerWidth / (IS_IOS ? 2 : 3));
      return;
    }
    const base = wasOpen ? DRAWER_WIDTH : 0;
    const current = Math.max(0, Math.min(base + dx, DRAWER_WIDTH));
    snapTo(current > DRAWER_WIDTH / 2);
  }, { passive: true });

  // 系統中途接管觸控(例如安卓判定為捲動或系統手勢)時,把選單/詳細頁歸位,避免卡在半開狀態
  document.addEventListener('touchcancel', function() {
    const was = active;
    reset();
    if (!was) return;
    if (mode === 'back') finishBack(false);
    else if (mode === 'drawer') snapTo(wasOpen);
  }, { passive: true });
})();

// ==================== 掃碼頁:右滑回到左側選單 ====================
(function() {
  const scr = document.getElementById('scanScreen');
  const IS_IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let sx = 0, sy = 0, ok = false;
  document.addEventListener('touchstart', function(e) {
    ok = false;
    if (!scr.classList.contains('active') || e.touches.length !== 1) return;
    const t = e.touches[0];
    if (IS_IOS && t.clientX > 24) return; // iPhone 只吃左緣,和其他頁一致
    sx = t.clientX; sy = t.clientY; ok = true;
  }, { passive: true });
  document.addEventListener('touchend', function(e) {
    if (!ok) return;
    ok = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = Math.abs(t.clientY - sy);
    if (dx > 80 && dx > dy * 1.5) { document.getElementById('scanBackBtn').click(); openDrawer(); } // 返回後直接開左側選單
  }, { passive: true });
  document.addEventListener('touchcancel', function() { ok = false; }, { passive: true });
})();

// ==================== 手勢與導覽：首次登入的滑動提示 ====================
function showSwipeHintOnce() {
  try {
    if (localStorage.getItem('seen_swipe_hint')) return;
    localStorage.setItem('seen_swipe_hint', '1');
  } catch(e) {}
  const hint = document.getElementById('swipeHint');
  setTimeout(function(){ hint.classList.add('show'); }, 500);
  setTimeout(function(){ hint.classList.remove('show'); }, 3500);
}

// ==================== 手勢與導覽：下拉刷新 ====================
(function() {
  const indicator = document.getElementById('pullIndicator');
  const pullText = document.getElementById('pullText');
  let startY = 0, pulling = false, triggered = false;
  const THRESHOLD = 60;
  const MAX_PULL = 90;

  document.addEventListener('touchstart', function(e) {
    if (!document.getElementById('homeScreen').classList.contains('active')) return;
    if (edgeGestureActive) return;
    if (window.scrollY > 0) return;
    startY = e.touches[0].clientY;
    pulling = true;
    triggered = false;
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (edgeGestureActive) { pulling = false; indicator.style.height = '0px'; return; }
    if (!pulling || triggered) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) { indicator.style.height = '0px'; return; }
    if (e.cancelable) e.preventDefault();
    const capped = Math.min(dy * 0.5, MAX_PULL);
    indicator.style.height = capped + 'px';
    pullText.textContent = capped >= THRESHOLD ? '放開立即更新' : '下拉重新整理';
  }, { passive: false });

  document.addEventListener('touchend', function() {
    if (!pulling) return;
    pulling = false;
    const h = parseFloat(indicator.style.height) || 0;
    if (h >= THRESHOLD && !triggered) {
      triggered = true;
      indicator.classList.add('loading');
      pullText.textContent = '更新中…';
      indicator.style.height = '48px';
      checkAppUpdate(true).then(function(reloading) {
        if (reloading) return;
        return fetchData().then(function(success) {
          indicator.classList.remove('loading');
          indicator.style.height = '0px';
          if (success) markUpdatesSeen();
        });
      });
    } else {
      indicator.style.height = '0px';
    }
  }, { passive: true });
})();

// ==================== 手勢與導覽：點頂部狀態列回頂 ====================
(function() {
  document.getElementById('statusBar').addEventListener('click', function(){
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();

// ==================== App 啟動:直接進首頁,沒有登入畫面 ====================
showScreen('homeScreen');
updateHomeView();
fetchData();
silentCheckAppUpdate(); // 打開 App 時悄悄檢查一次有沒有新版(有的話只亮紅點)
showSwipeHintOnce();
</script>
